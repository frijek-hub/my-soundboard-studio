<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      viewport-fit=cover">

<meta name="theme-color" content="#0d0f12">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="Soundboard">

<title>My Soundboard Studio</title>

<style>

:root{
  color-scheme:dark;

  --bg:#0d0f12;
  --panel:#181b21;
  --panel2:#22262e;
  --line:#343943;
  --text:#f5f7fa;
  --muted:#9da4b0;
  --accent:#5b8cff;
  --danger:#ff5c5c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    Arial,
    sans-serif;
}

body{
  padding-bottom:30px;
}

button{
  appearance:none;
  -webkit-appearance:none;

  border:1px solid var(--line);
  border-radius:14px;

  background:var(--panel);
  color:var(--text);

  padding:12px 16px;
  min-height:48px;

  font-size:16px;
  font-weight:500;
}

button:active{
  transform:scale(.97);
}

button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
  font-weight:700;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    14px;

  background:rgba(13,15,18,.94);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);
}

h1{
  margin:0 0 14px;

  font-size:25px;
  line-height:1.15;
}

.toolbar{
  display:flex;
  gap:9px;

  overflow-x:auto;

  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.toolbar button{
  flex:0 0 auto;
}


/* MAIN */

main{
  width:100%;
  max-width:1100px;

  margin:auto;

  padding:
    16px
    14px
    80px;
}


/* BOARDS */

.boards{
  display:flex;
  gap:9px;

  overflow-x:auto;

  margin-bottom:16px;

  scrollbar-width:none;
}

.boards::-webkit-scrollbar{
  display:none;
}

.board{
  flex:0 0 auto;
  white-space:nowrap;
}

.board.active{
  background:var(--panel2);
  border-color:var(--accent);

  box-shadow:
    0 0 0 1px
    rgba(91,140,255,.15);
}


/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:12px;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

@media(min-width:1000px){

  .grid{
    grid-template-columns:
      repeat(4,minmax(0,1fr));
  }

}


/* SOUND CARD */

.pad{
  min-height:205px;

  padding:16px;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:var(--panel);

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  overflow:hidden;

  user-select:none;
  -webkit-user-select:none;

  cursor:pointer;

  transition:
    transform .08s ease,
    border-color .12s ease,
    box-shadow .12s ease;
}

.pad:active{
  transform:scale(.97);
}

.pad.playing{

  border-color:var(--accent);

  box-shadow:
    0 0 0 2px
    rgba(91,140,255,.28),

    0 8px 30px
    rgba(91,140,255,.15);
}

.pad-icon{
  font-size:38px;
  line-height:1;

  margin-bottom:12px;
}

.pad-name{
  font-size:20px;
  font-weight:700;

  line-height:1.2;

  word-break:break-word;
}

.pad-time{
  margin-top:7px;

  color:var(--muted);

  font-size:15px;

  font-variant-numeric:
    tabular-nums;
}

.pad-actions{
  display:flex;

  gap:8px;

  margin-top:14px;
}

.pad-actions button{

  flex:1;

  min-height:43px;

  padding:7px 8px;

  font-size:18px;
}

.pad-actions button[data-delete]{
  color:#ffb0b0;
}


/* EMPTY */

.empty{

  text-align:center;

  border:
    1px dashed var(--line);

  border-radius:20px;

  padding:45px 20px;

  color:var(--muted);

  line-height:1.7;
}


/* STATUS */

.status{

  position:fixed;

  left:50%;

  bottom:
    calc(
      20px +
      env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  z-index:100;

  background:#252a33;

  border:
    1px solid var(--line);

  padding:10px 15px;

  border-radius:999px;

  color:var(--text);

  font-size:14px;

  opacity:0;

  pointer-events:none;

  transition:opacity .2s;
}

.status.show{
  opacity:1;
}


/* DIALOG */

dialog{

  width:min(94vw,760px);

  max-height:92vh;

  margin:auto;

  padding:0;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:var(--panel);

  color:var(--text);

  overflow:hidden;
}

dialog::backdrop{

  background:
    rgba(0,0,0,.75);

  backdrop-filter:blur(4px);
}

.modal{

  padding:20px;

  max-height:92vh;

  overflow-y:auto;
}

.modal h2{

  margin:
    0 0 20px;

  font-size:24px;
}

.field{
  margin:16px 0;
}

label{

  display:block;

  margin-bottom:8px;

  color:var(--muted);

  font-size:14px;
}

input[type=text],
input[type=file]{

  width:100%;

  padding:13px;

  border-radius:12px;

  border:
    1px solid var(--line);

  background:var(--bg);

  color:var(--text);

  font-size:16px;
}

input[type=file]{
  padding:11px;
}

input[type=range]{

  width:100%;

  accent-color:var(--accent);
}

.range-row{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:14px;
}

.range-value{

  color:var(--text);

  font-size:14px;

  text-align:right;

  margin-top:5px;

  font-variant-numeric:
    tabular-nums;
}

.row{

  display:flex;

  gap:9px;

  flex-wrap:wrap;
}

.row button{
  flex:1;
}


/* WAVEFORM */

.wave-wrap{
  margin:
    8px 0 20px;
}

.wave{

  position:relative;

  height:160px;

  border-radius:15px;

  overflow:hidden;

  background:#11141a;

  border:
    1px solid var(--line);
}

#waveCanvas{

  width:100%;
  height:100%;

  display:block;
}

.selection{

  position:absolute;

  top:0;
  bottom:0;

  background:
    rgba(91,140,255,.23);

  border-left:
    3px solid var(--accent);

  border-right:
    3px solid var(--accent);

  pointer-events:none;
}

.note{

  color:var(--muted);

  font-size:13px;

  line-height:1.5;

  margin-top:16px;
}

.recording{

  color:#ff6262 !important;

  border-color:#ff6262 !important;
}

.checkbox{

  display:flex;

  align-items:center;

  gap:10px;

  margin:15px 0;
}

.checkbox input{

  width:20px;
  height:20px;
}

@media(max-width:450px){

  .pad{

    min-height:190px;

    padding:14px;
  }

  .pad-name{
    font-size:18px;
  }

  .pad-icon{
    font-size:34px;
  }

  h1{
    font-size:23px;
  }

}

</style>
</head>


<body>

🎛️ My Soundboard Studio

<dialog id="addDialog">

<script>


/* =========================================================
   DATENBANK
========================================================= */

const DB_NAME =
  "MySoundboardStudio";

const DB_VERSION = 6;

let db = null;


let state = {

  boards:[
    "Hauptboard"
  ],

  current:
    "Hauptboard",

  sounds:[]
};


let currentEdit = null;

let currentSource = null;

let currentPad = null;

let recorder = null;

let recordedChunks = [];

let audioCtx = null;

let decodedCache =
  new Map();



/* =========================================================
   HILFSFUNKTIONEN
========================================================= */

const $ =
  id => document.getElementById(id);


function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return Date.now() +
    "-" +
    Math.random();
}


function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c])
    );
}


function showStatus(text){

  const el =
    $("status");

  el.textContent =
    text;

  el.classList.add(
    "show"
  );

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      ()=>{

        el.classList.remove(
          "show"
        );

      },
      1800
    );
}


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){

    return "00:00.000";

  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    secs
      .toFixed(3)
      .padStart(6,"0")
  );
}



/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        () => {

          const database =
            request.result;


          if(
            !database
              .objectStoreNames
              .contains("meta")
          ){

            database.createObjectStore(
              "meta",
              {
                keyPath:"key"
              }
            );

          }


          if(
            !database
              .objectStoreNames
              .contains("sounds")
          ){

            database.createObjectStore(
              "sounds",
              {
                keyPath:"id"
              }
            );

          }

        };


      request.onsuccess =
        () => {

          db =
            request.result;

          resolve();

        };


      request.onerror =
        () => {

          reject(
            request.error
          );

        };

    }
  );

}



function getMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction("meta")
          .objectStore("meta")
          .get("state");


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}



function saveMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "meta",
            "readwrite"
          )
          .objectStore("meta")
          .put({

            key:"state",

            boards:
              state.boards,

            current:
              state.current

          });


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}



function getSounds(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction("sounds")
          .objectStore("sounds")
          .getAll();


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}



function saveSound(sound){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "sounds",
            "readwrite"
          )
          .objectStore("sounds")
          .put(sound);


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}



function deleteSound(id){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "sounds",
            "readwrite"
          )
          .objectStore("sounds")
          .delete(id);


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}



/* =========================================================
   AUDIO DATEN
========================================================= */


/*
   Sehr wichtig:

   Alte Versionen haben teilweise
   "blob" gespeichert.

   Wir wandeln solche Sounds automatisch
   in "audioData" um.
*/


async function ensureAudioData(sound){

  if(
    sound.audioData instanceof
    ArrayBuffer
  ){

    return true;

  }


  if(
    sound.audioData instanceof
    Uint8Array
  ){

    sound.audioData =
      sound.audioData.buffer;

    await saveSound(
      sound
    );

    return true;

  }


  if(
    sound.blob instanceof Blob
  ){

    sound.type =
      sound.type ||
      sound.blob.type ||
      "audio/mpeg";


    sound.audioData =
      await sound.blob.arrayBuffer();


    delete sound.blob;


    await saveSound(
      sound
    );

    return true;

  }


  return false;

}



/* =========================================================
   AUDIO CONTEXT
========================================================= */

async function getAudioContext(){

  if(!audioCtx){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      throw new Error(
        "Web Audio wird nicht unterstützt"
      );

    }


    audioCtx =
      new AudioContext();

  }


  if(
    audioCtx.state ===
    "suspended"
  ){

    await audioCtx.resume();

  }


  return audioCtx;

}



/* =========================================================
   AUDIO BUFFER
========================================================= */

async function getBuffer(sound){

  await ensureAudioData(
    sound
  );


  if(
    !sound.audioData
  ){

    throw new Error(
      "Keine Audiodaten vorhanden"
    );

  }


  if(
    decodedCache.has(
      sound.id
    )
  ){

    return decodedCache.get(
      sound.id
    );

  }


  const context =
    await getAudioContext();


  /*
    slice() erzeugt eine Kopie.

    Das ist auf Safari/iOS
    zuverlässiger.
  */

  const data =
    sound.audioData.slice(0);


  const buffer =
    await context.decodeAudioData(
      data
    );


  decodedCache.set(
    sound.id,
    buffer
  );


  return buffer;

}



/* =========================================================
   STOPPEN
========================================================= */

function stopAll(){

  if(
    currentSource
  ){

    try{

      currentSource.stop();

    }catch(e){}

    currentSource =
      null;

  }


  document
    .querySelectorAll(
      ".playing"
    )
    .forEach(
      el =>
        el.classList.remove(
          "playing"
        )
    );


  currentPad =
    null;

}



/* =========================================================
   SOUND ABSPIELEN
========================================================= */

async function playSound(
  sound,
  pad
){

  /*
    Wenn bereits ein Sound läuft,
    zuerst stoppen.
  */

  stopAll();


  try{

    const context =
      await getAudioContext();


    const buffer =
      await getBuffer(
        sound
      );


    const duration =
      buffer.duration;


    let start =
      Number(sound.start);


    let end =
      Number(sound.end);


    if(
      !Number.isFinite(start)
    ){

      start = 0;

    }


    if(
      !Number.isFinite(end) ||
      end <= 0
    ){

      end =
        duration;

    }


    start =
      Math.max(
        0,
        Math.min(
          start,
          duration
        )
      );


    end =
      Math.max(
        start + 0.001,
        Math.min(
          end,
          duration
        )
      );


    const source =
      context.createBufferSource();


    const gain =
      context.createGain();


    source.buffer =
      buffer;


    gain.gain.value =
      Math.max(
        0,
        Math.min(
          1,
          Number(
            sound.volume ?? 100
          ) / 100
        )
      );


    source.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    currentSource =
      source;


    currentPad =
      pad;


    if(pad){

      pad.classList.add(
        "playing"
      );

    }


    source.onended =
      () => {

        /*
          Loop:
          exakt denselben Ausschnitt
          erneut abspielen.
        */

        if(
          sound.loop &&
          currentSource === source
        ){

          playSound(
            sound,
            pad
          );

          return;

        }


        if(
          currentSource === source
        ){

          currentSource =
            null;

          currentPad =
            null;

          if(pad){

            pad.classList.remove(
              "playing"
            );

          }

        }

      };


    /*
      Hier passiert der eigentliche
      Zuschnitt.

      start = Startposition
      end-start = Länge
    */

    source.start(
      0,
      start,
      end - start
    );


  }catch(error){

    console.error(
      "Wiedergabe:",
      error
    );


    if(pad){

      pad.classList.remove(
        "playing"
      );

    }


    currentSource =
      null;


    showStatus(
      "Sound konnte nicht abgespielt werden"
    );

  }

}



/* =========================================================
   WAVEFORM
========================================================= */

function drawWaveform(
  buffer
){

  const canvas =
    $("waveCanvas");


  const rect =
    canvas.getBoundingClientRect();


  const ratio =
    window.devicePixelRatio ||
    1;


  const width =
    Math.max(
      1,
      rect.width
    );


  const height =
    Math.max(
      1,
      rect.height
    );


  canvas.width =
    width * ratio;


  canvas.height =
    height * ratio;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );


  const data =
    buffer.getChannelData(0);


  const step =
    Math.max(
      1,
      Math.floor(
        data.length /
        width
      )
    );


  const middle =
    height / 2;


  const amplitude =
    height * 0.43;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.beginPath();


  for(
    let x=0;
    x<width;
    x++
  ){

    const start =
      Math.floor(
        x * step
      );


    let min =
      1;

    let max =
      -1;


    for(
      let i=0;
      i<step &&
      start+i<data.length;
      i++
    ){

      const value =
        data[start+i];


      if(
        value < min
      ){

        min =
          value;

      }


      if(
        value > max
      ){

        max =
          value;

      }

    }


    ctx.moveTo(
      x,
      middle +
      min * amplitude
    );


    ctx.lineTo(
      x,
      middle +
      max * amplitude
    );

  }


  ctx.strokeStyle =
    "#5b8cff";


  ctx.lineWidth =
    1;


  ctx.stroke();

}



/* =========================================================
   SCHNITTANZEIGE
========================================================= */

function updateSelection(){

  if(
    !currentEdit
  ){

    return;

  }


  const start =
    Number(
      $("startRange").value
    ) / 100000;


  const end =
    Number(
      $("endRange").value
    ) / 100000;


  const duration =
    currentEdit.duration ||
    0;


  $("selection").style.left =
    (start * 100) +
    "%";


  $("selection").style.right =
    ((1-end) * 100) +
    "%";


  $("startValue").textContent =
    formatTime(
      start * duration
    );


  $("endValue").textContent =
    formatTime(
      end * duration
    );


  $("volumeValue").textContent =
    $("volumeRange").value;

}



/* =========================================================
   EDITOR ÖFFNEN
========================================================= */

async function openEditor(
  sound
){

  currentEdit =
    sound;


  $("editTitle").textContent =
    "Bearbeiten: " +
    sound.name;


  $("editName").value =
    sound.name;


  const duration =
    sound.duration || 0;


  let start =
    Number(sound.start) ||
    0;


  let end =
    Number(sound.end);


  if(
    !Number.isFinite(end) ||
    end <= 0
  ){

    end =
      duration;

  }


  $("startRange").value =
    Math.round(
      (start / duration) *
      100000
    );


  $("endRange").value =
    Math.round(
      (end / duration) *
      100000
    );


  $("volumeRange").value =
    sound.volume ?? 100;


  $("loopCheck").checked =
    !!sound.loop;


  updateSelection();


  $("editDialog").showModal();


  try{

    const buffer =
      await getBuffer(
        sound
      );


    drawWaveform(
      buffer
    );

  }catch(error){

    console.error(
      error
    );

  }

}



/* =========================================================
   RANGE INPUTS
========================================================= */

$("startRange").oninput =
  updateSelection;


$("endRange").oninput =
  updateSelection;


$("volumeRange").oninput =

/* =========================================================
   EDITOR SCHLIESSEN
========================================================= */

$("closeEdit").onclick =

    stopAll();

/* =========================================================
   VORSCHAU
========================================================= */

$("previewBtn").onclick =
  async () => {

    if(
      !currentEdit
    ){

      return;

    }


    const duration =
      currentEdit.duration;


    const start =
      Number(
        $("startRange").value
      ) /
      100000 *
      duration;


    const end =
      Number(
        $("endRange").value
      ) /
      100000 *
      duration;


    const preview =
      {

        ...currentEdit,

        start:start,

        end:Math.max(
          start + 0.001,
          end
        ),

        volume:
          Number(
            $("volumeRange").value
          ),

        loop:false

      };


    await playSound(
      preview,
      null
    );

  };



/* =========================================================
   ÄNDERUNGEN SPEICHERN
========================================================= */

$("saveEdit").onclick =
  async () => {

    if(
      !currentEdit
    ){

      return;

    }


    const duration =
      currentEdit.duration;


    const start =
      Number(
        $("startRange").value
      ) /
      100000 *
      duration;


    let end =
      Number(
        $("endRange").value
      ) /
      100000 *
      duration;


    end =
      Math.max(
        start + 0.001,
        Math.min(
          duration,
          end
        )
      );


    currentEdit.start =
      start;


    currentEdit.end =
      end;


    currentEdit.volume =
      Number(
        $("volumeRange").value
      );


    currentEdit.loop =
      $("loopCheck").checked;


    currentEdit.name =
      $("editName")
        .value
        .trim()
      ||
      currentEdit.name;


    await saveSound(
      currentEdit
    );


    $("editDialog").close();


    showStatus(
      "Änderungen gespeichert"
    );


    render();

  };



/* =========================================================
   SOUNDS HINZUFÜGEN
========================================================= */

$("addBtn").onclick =
  () => {

    $("addDialog")
      .showModal();

  };


$("cancelAdd").onclick =
  () => {

    $("addDialog")
      .close();

  };



$("saveAdd").onclick =
  async () => {

    const file =
      $("audioFile")
        .files[0];


    if(!file){

      alert(
        "Bitte zuerst eine Audiodatei auswählen."
      );

      return;

    }


    try{

      showStatus(
        "Audio wird gespeichert …"
      );


      /*
        Die Datei aus Downloads
        wird hier KOMPLETT in den
        Speicher der Web-App kopiert.
      */

      const audioData =
        await file.arrayBuffer();


      const context =
        await getAudioContext();


      /*
        Kopie für decodeAudioData.
      */

      const decodeData =
        audioData.slice(0);


      const buffer =
        await context.decodeAudioData(
          decodeData
        );


      const sound = {

        id:
          uid(),

        name:
          $("soundName")
            .value
            .trim()
          ||
          file.name
            .replace(
              /\.[^.]+$/,
              ""
            ),

        icon:
          $("soundIcon")
            .value
            .trim()
          ||
          "🔊",

        board:
          state.current,

        /*
          DAS ist jetzt die
          dauerhaft gespeicherte
          Audiodatei.
        */

        audioData:
          audioData,

        type:
          file.type ||
          "audio/mpeg",

        duration:
          buffer.duration,

        start:
          0,

        end:
          buffer.duration,

        volume:
          100,

        loop:
          false

      };


      /*
        Direkt im Cache behalten,
        damit der erste Start
        sofort funktioniert.
      */

      decodedCache.set(
        sound.id,
        buffer
      );


      state.sounds.push(
        sound
      );


      await saveSound(
        sound
      );


      await saveMeta();


      $("audioFile").value =
        "";

      $("soundName").value =
        "";


      $("addDialog")
        .close();


      render();


      showStatus(
        "Sound dauerhaft gespeichert ✓"
      );


    }catch(error){

      console.error(
        "Import:",
        error
      );


      alert(
        "Die Audiodatei konnte nicht gelesen werden."
      );

    }

  };



/* =========================================================
   BOARD ERSTELLEN
========================================================= */

$("boardBtn").onclick =
  async () => {

    const name =
      prompt(
        "Name des neuen Soundboards:"
      );


    if(
      !name ||
      !name.trim()
    ){

      return;

    }


    const clean =
      name.trim();


    if(
      state.boards.includes(
        clean
      )
    ){

      alert(
        "Dieses Board existiert bereits."
      );

      return;

    }


    state.boards.push(
      clean
    );


    state.current =
      clean;


    await saveMeta();


    render();

  };



/* =========================================================
   AUFNAHME
========================================================= */

$("recordBtn").onclick =
  async () => {


    /*
      Wenn bereits aufgenommen
      wird -> stoppen.
    */

    if(recorder){

      recorder.stop();

      return;

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      alert(
        "Dein Browser unterstützt keine Mikrofonaufnahme."
      );

      return;

    }


    if(
      !window.MediaRecorder
    ){

      alert(
        "Dein Browser unterstützt keine Audioaufnahme."
      );

      return;

    }


    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });


      recordedChunks =
        [];


      recorder =
        new MediaRecorder(
          stream
        );


      $("recordBtn")
        .textContent =
        "■ Aufnahme stoppen";


      $("recordBtn")
        .classList.add(
          "recording"
        );


      recorder.ondataavailable =
        event => {

          if(
            event.data &&
            event.data.size
          ){

            recordedChunks.push(
              event.data
            );

          }

        };


      recorder.onstop =
        async () => {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          $("recordBtn")
            .textContent =
            "● Aufnahme";


          $("recordBtn")
            .classList.remove(
              "recording"
            );


          try{

            const blob =
              new Blob(
                recordedChunks,
                {
                  type:
                    recorder.mimeType ||
                    "audio/webm"
                }
              );


            /*
              Auch die Aufnahme wird
              komplett als ArrayBuffer
              gespeichert.
            */

            const audioData =
              await blob.arrayBuffer();


            const context =
              await getAudioContext();


            const buffer =
              await context
                .decodeAudioData(
                  audioData.slice(0)
                );


            const name =
              prompt(
                "Name für die Aufnahme:",
                "Meine Aufnahme"
              )
              ||
              "Meine Aufnahme";


            const sound = {

              id:
                uid(),

              name:
                name,

              icon:
                "🎙️",

              board:
                state.current,

              audioData:
                audioData,

              type:
                blob.type,

              duration:
                buffer.duration,

              start:
                0,

              end:
                buffer.duration,

              volume:
                100,

              loop:
                false

            };


            decodedCache.set(
              sound.id,
              buffer
            );


            state.sounds.push(
              sound
            );


            await saveSound(
              sound
            );


            await saveMeta();


            render();


            showStatus(
              "Aufnahme gespeichert ✓"
            );


          }catch(error){

            console.error(
              error
            );


            alert(
              "Die Aufnahme konnte nicht gespeichert werden."
            );

          }


          recorder =
            null;

        };


      recorder.start();


    }catch(error){

      console.error(
        error
      );


      alert(
        "Der Zugriff auf das Mikrofon wurde nicht erlaubt."
      );

    }

  };



/* =========================================================
   DARSTELLUNG
========================================================= */

function render(){

  $("boards").innerHTML =
    "";


  state.boards.forEach(
    board => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "board" +
        (
          board ===
          state.current
          ?
          " active"
          :
          ""
        );


      button.textContent =
        board;


      button.onclick =
        async () => {

          state.current =
            board;


          await saveMeta();


          render();

        };


      $("boards")
        .appendChild(
          button
        );

    }
  );


  $("grid").innerHTML =
    "";


  const sounds =
    state.sounds.filter(
      sound =>
        sound.board ===
        state.current
    );


  $("empty").style.display =
    sounds.length
    ?
    "none"
    :
    "block";


  sounds.forEach(
    sound => {

      const pad =
        document.createElement(
          "div"
        );


      pad.className =
        "pad";


      const duration =
        Math.max(
          0,
          (
            Number(
              sound.end
            ) ||
            Number(
              sound.duration
            ) ||
            0
          )
          -
          (
            Number(
              sound.start
            ) ||
            0
          )
        );


      pad.innerHTML = `

        <div>

          <div
            class="pad-icon">

            ${esc(
              sound.icon ||
              "🔊"
            )}

          </div>


          <div
            class="pad-name">

            ${esc(
              sound.name
            )}

          </div>


          <div
            class="pad-time">

            ${formatTime(
              duration
            )}

          </div>

        </div>


        <div
          class="pad-actions">

          <button
            data-edit>
            ✎
          </button>

          <button
            data-delete>
            🗑️
          </button>

        </div>

      `;


      /*
        GANZE KARTE = PLAY
      */

      pad.onclick =
        () => {

          playSound(
            sound,
            pad
          );

        };


      /*
        Bearbeiten darf nicht
        gleichzeitig abspielen.
      */

      pad
        .querySelector(
          "[data-edit]"
        )
        .onclick =
        event => {

          event.stopPropagation();

          openEditor(
            sound
          );

        };


      /*
        Löschen darf ebenfalls
        nicht abspielen.
      */

      pad
        .querySelector(
          "[data-delete]"
        )
        .onclick =
        async event => {

          event.stopPropagation();


          if(
            !confirm(
              "Diesen Sound wirklich löschen?"
            )
          ){

            return;

          }


          if(
            currentSource
          ){

            stopAll();

          }


          decodedCache.delete(
            sound.id
          );


          state.sounds =
            state.sounds.filter(
              item =>
                item.id !==
                sound.id
            );


          await deleteSound(
            sound.id
          );


          render();

        };


      $("grid")
        .appendChild(
          pad
        );

    }
  );

}



/* =========================================================
   START
========================================================= */

async function init(){

  try{

    await openDB();


    const meta =
      await getMeta();


    if(meta){

      if(
        Array.isArray(
          meta.boards
        ) &&
        meta.boards.length
      ){

        state.boards =
          meta.boards;

      }


      if(
        meta.current &&
        state.boards.includes(
          meta.current
        )
      ){

        state.current =
          meta.current;

      }else{

        state.current =
          state.boards[0];

      }

    }


    /*
      Sounds aus IndexedDB laden.
    */

    state.sounds =
      await getSounds();


    /*
      Alte Sounds aus einer
      früheren Version automatisch
      konvertieren.
    */

    for(
      const sound of
      state.sounds
    ){

      try{

        await ensureAudioData(
          sound
        );

      }catch(error){

        console.warn(
          "Audio-Migration:",
          error
        );

      }

    }


    render();


  }catch(error){

    console.error(
      "Initialisierung:",
      error
    );


    alert(
      "Der lokale Speicher konnte nicht geöffnet werden."
    );

  }

}



/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  async () => {

    if(
      currentEdit &&
      decodedCache.has(
        currentEdit.id
      )
    ){

      drawWaveform(
        decodedCache.get(
          currentEdit.id
        )
      );

    }

  }
);



/* START */

init();

</script>
