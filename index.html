<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0d0f12">

<link rel="manifest" href="manifest.webmanifest">

<title>My Soundboard Studio</title>

<style>

:root{
  color-scheme:dark;
  --bg:#0d0f12;
  --panel:#181b21;
  --panel2:#22262e;
  --line:#343943;
  --text:#f5f7fa;
  --muted:#9da4b0;
  --accent:#5b8cff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,
              BlinkMacSystemFont,
              "SF Pro Display",
              Arial,
              sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:16px;
  background:rgba(13,15,18,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

h1{
  font-size:22px;
  margin:0 0 13px;
}

.toolbar{
  display:flex;
  gap:8px;
  overflow:auto;
}

button{
  min-height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  padding:11px 14px;
  font-size:15px;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.98);
}

button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  font-weight:600;
}

main{
  max-width:900px;
  margin:auto;
  padding:14px 14px 80px;
}

.boards{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:14px;
  padding-bottom:2px;
}

.board{
  white-space:nowrap;
}

.board.active{
  background:var(--panel2);
  border-color:var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:10px;
}

.pad{
  min-height:145px;
  padding:15px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
}

.pad strong{
  font-size:17px;
}

.pad small{
  color:var(--muted);
}

.pad-actions{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.pad-actions button{
  min-height:40px;
  padding:7px 10px;
}

.playing{
  outline:2px solid var(--accent);
}

.empty{
  text-align:center;
  border:1px dashed var(--line);
  border-radius:16px;
  padding:35px 15px;
  color:var(--muted);
}

dialog{
  width:min(94vw,620px);
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:18px;
  padding:0;
}

dialog::backdrop{
  background:rgba(0,0,0,.72);
}

.modal{
  padding:18px;
}

.field{
  margin:14px 0;
}

label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

input[type=text],
input[type=file]{
  width:100%;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:12px;
  font-size:16px;
}

input[type=range]{
  width:100%;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
}

.wave{
  height:90px;
  margin:14px 0;
  border-radius:12px;
  position:relative;
  overflow:hidden;

  background:
    repeating-linear-gradient(
      90deg,
      #303640 0 2px,
      transparent 2px 7px
    );
}

.selection{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(91,140,255,.22);
  border-left:3px solid var(--accent);
  border-right:3px solid var(--accent);
}

.note{
  font-size:12px;
  line-height:1.45;
  color:var(--muted);
}

.recording{
  color:#ff6262!important;
}

.status{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

@media(min-width:650px){

  .grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

</style>
</head>

<body>

<header>

<h1>🎛️ My Soundboard Studio</h1>

<div class="toolbar">

<button
  class="primary"
  id="addBtn">
  ＋ Sound hinzufügen
</button>

<button
  id="recordBtn">
  ● Aufnahme
</button>

<button
  id="boardBtn">
  ＋ Board
</button>

</div>

</header>


<main>

<div
  class="boards"
  id="boards">
</div>


<div
  class="grid"
  id="grid">
</div>


<div
  class="empty"
  id="empty">

Noch keine Sounds vorhanden.

<br><br>

Importiere einen Sound
oder nimm einen auf.

</div>


<div
  class="status"
  id="status">
</div>

</main>


<!-- SOUND HINZUFÜGEN -->

<dialog id="addDialog">

<div class="modal">

<h2>
Sound hinzufügen
</h2>


<div class="field">

<label>
Audiodatei
</label>

<input
  id="audioFile"
  type="file"

  accept="
    .mp3,
    .m4a,
    .wav,
    .aac,
    .aiff,
    .aif,
    .caf,
    .ogg,
    .opus,
    audio/*
  "
>

</div>


<div class="field">

<label>
Name
</label>

<input
  id="soundName"
  type="text"
  placeholder="z. B. Applaus"
>

</div>


<div class="field">

<label>
Icon
</label>

<input
  id="soundIcon"
  type="text"
  value="🔊"
>

</div>


<div class="row">

<button
  id="cancelAdd">
  Abbrechen
</button>

<button
  class="primary"
  id="saveAdd">
  Speichern
</button>

</div>

</div>

</dialog>


<!-- SOUND BEARBEITEN -->

<dialog id="editDialog">

<div class="modal">


<h2 id="editTitle">
Sound bearbeiten
</h2>


<div class="wave">

<div
  class="selection"
  id="selection">
</div>

</div>


<div class="row">


<div class="field">

<label>
Start
</label>

<input
  id="startRange"
  type="range"
  min="0"
  max="100"
  value="0"
>

</div>


<div class="field">

<label>
Ende
</label>

<input
  id="endRange"
  type="range"
  min="0"
  max="100"
  value="100"
>

</div>


</div>


<div class="field">

<label>
Lautstärke
</label>

<input
  id="volumeRange"
  type="range"
  min="0"
  max="100"
  value="100"
>

</div>


<div class="field">

<label>
Name
</label>

<input
  id="editName"
  type="text"
>

</div>


<div class="row">

<button
  id="closeEdit">
  Schließen
</button>

<button
  id="previewBtn">
  ▶ Vorschau
</button>

<button
  class="primary"
  id="saveEdit">
  Speichern
</button>

</div>


<p class="note">

Der ausgewählte Bereich wird beim
Abspielen verwendet.

Die Originaldatei bleibt erhalten.

</p>


</div>

</dialog>


<script>


/* =========================================================
   DATENBANK
========================================================= */


const DB_NAME =
  "MySoundboardStudio";

const DB_VERSION =
  1;


let db;


let state = {

  boards:[
    "Hauptboard"
  ],

  current:
    "Hauptboard",

  sounds:[]

};


let currentEdit =
  null;


let currentAudio =
  null;


let recorder =
  null;


let recordedChunks =
  [];


const $ =
  id =>
    document.getElementById(id);



/* =========================================================
   INDEXED DB ÖFFNEN
========================================================= */


function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        ()=>{

          const database =
            request.result;


          if(
            !database.objectStoreNames
              .contains("meta")
          ){

            database.createObjectStore(
              "meta",
              {
                keyPath:"key"
              }
            );

          }


          if(
            !database.objectStoreNames
              .contains("sounds")
          ){

            database.createObjectStore(
              "sounds",
              {
                keyPath:"id"
              }
            );

          }

        };


      request.onsuccess =
        ()=>{

          db =
            request.result;

          resolve();

        };


      request.onerror =
        ()=>{

          reject(
            request.error
          );

        };

    }
  );

}



/* =========================================================
   META LADEN
========================================================= */


function getMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
        .transaction("meta")
        .objectStore("meta")
        .get("state");


      request.onsuccess =
        ()=>{

          resolve(
            request.result
          );

        };


      request.onerror =
        ()=>{

          reject(
            request.error
          );

        };

    }
  );

}



/* =========================================================
   META SPEICHERN
========================================================= */


function saveMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
        .transaction(
          "meta",
          "readwrite"
        )
        .objectStore("meta")
        .put({

          key:"state",

          boards:
            state.boards,

          current:
            state.current

        });


      request.onsuccess =
        ()=>resolve();


      request.onerror =
        ()=>reject(
          request.error
        );

    }
  );

}



/* =========================================================
   SOUNDS LADEN
========================================================= */


function getSounds(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
        .transaction("sounds")
        .objectStore("sounds")
        .getAll();


      request.onsuccess =
        ()=>{

          resolve(
            request.result
          );

        };


      request.onerror =
        ()=>{

          reject(
            request.error
          );

        };

    }
  );

}



/* =========================================================
   SOUND SPEICHERN
========================================================= */


function saveSound(sound){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
        .transaction(
          "sounds",
          "readwrite"
        )
        .objectStore("sounds")
        .put(sound);


      request.onsuccess =
        ()=>resolve();


      request.onerror =
        ()=>reject(
          request.error
        );

    }
  );

}



/* =========================================================
   SOUND LÖSCHEN
========================================================= */


function deleteSound(id){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
        .transaction(
          "sounds",
          "readwrite"
        )
        .objectStore("sounds")
        .delete(id);


      request.onsuccess =
        ()=>resolve();


      request.onerror =
        ()=>reject(
          request.error
        );

    }
  );

}



/* =========================================================
   HTML SICHER MACHEN
========================================================= */


function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[character])
    );

}



/* =========================================================
   ZEIT FORMATIEREN
========================================================= */


function formatTime(seconds){

  if(
    !isFinite(seconds)
  ){

    return "—";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secondsPart =
    Math.floor(
      seconds % 60
    );


  return (

    minutes
    +
    ":"
    +
    String(
      secondsPart
    ).padStart(2,"0")

  );

}



/* =========================================================
   AUDIO URL ERSTELLEN
========================================================= */


function makeURL(sound){

  if(
    !sound.url &&
    sound.blob
  ){

    sound.url =
      URL.createObjectURL(
        sound.blob
      );

  }


  return sound.url;

}



/* =========================================================
   STATUS
========================================================= */


function setStatus(message){

  $("status").textContent =
    message || "";

}



/* =========================================================
   OBERFLÄCHE RENDERN
========================================================= */


function render(){

  const boards =
    $("boards");


  boards.innerHTML =
    "";


  state.boards.forEach(
    board=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "board"
        +
        (
          board === state.current
          ?
          " active"
          :
          ""
        );


      button.textContent =
        board;


      button.onclick =
        async()=>{

          state.current =
            board;

          await saveMeta();

          render();

        };


      boards.appendChild(
        button
      );

    }
  );


  const grid =
    $("grid");


  grid.innerHTML =
    "";


  const sounds =
    state.sounds.filter(
      sound =>
        sound.board ===
        state.current
    );


  $("empty").style.display =
    sounds.length
    ?
    "none"
    :
    "block";


  sounds.forEach(
    sound=>{

      makeURL(sound);


      const pad =
        document.createElement(
          "div"
        );


      pad.className =
        "pad";


      pad.style.background =
        sound.color ||
        "var(--panel)";


      pad.innerHTML = `

        <div>

          <div
            style="
              font-size:29px;
              margin-bottom:6px;
            "
          >
            ${esc(
              sound.icon || "🔊"
            )}
          </div>

          <strong>
            ${esc(sound.name)}
          </strong>

        </div>


        <div>

          <small>
            ${formatTime(
              sound.end -
              sound.start
            )}
          </small>


          <div
            class="pad-actions"
          >

            <button
              data-play
              aria-label="Abspielen"
            >
              ▶
            </button>


            <button
              data-edit
              aria-label="Bearbeiten"
            >
              ✎
            </button>


            <button
              data-delete
              aria-label="Löschen"
            >
              🗑
            </button>

          </div>

        </div>

      `;


      pad.querySelector(
        "[data-play]"
      ).onclick =
        ()=>{
          playSound(
            sound,
            pad
          );
        };


      pad.querySelector(
        "[data-edit]"
      ).onclick =
        ()=>{
          openEditor(
            sound
          );
        };


      pad.querySelector(
        "[data-delete]"
      ).onclick =
        async()=>{

          if(
            !confirm(
              "Diesen Sound wirklich löschen?"
            )
          ){

            return;

          }


          state.sounds =
            state.sounds.filter(
              item =>
                item.id !==
                sound.id
            );


          await deleteSound(
            sound.id
          );


          render();

          setStatus(
            "Sound gelöscht."
          );

        };


      grid.appendChild(
        pad
      );

    }
  );

}



/* =========================================================
   AUDIO STOPPEN
========================================================= */


function stopAudio(){

  if(
    currentAudio
  ){

    currentAudio.pause();

    currentAudio.currentTime =
      0;

    currentAudio =
      null;

  }


  document
    .querySelectorAll(
      ".playing"
    )
    .forEach(
      element =>
        element.classList
          .remove("playing")
    );

}



/* =========================================================
   SOUND ABSPIELEN
========================================================= */


function playSound(
  sound,
  pad
){

  stopAudio();


  const url =
    makeURL(sound);


  if(!url){

    setStatus(
      "Audiodatei konnte nicht geladen werden."
    );

    return;

  }


  const audio =
    new Audio(url);


  currentAudio =
    audio;


  audio.volume =
    (
      sound.volume ??
      100
    ) / 100;


  audio.currentTime =
    Math.max(
      0,
      sound.start || 0
    );


  pad.classList.add(
    "playing"
  );


  setStatus(
    "▶ " +
    sound.name
  );


  audio.ontimeupdate =
    ()=>{

      if(
        audio.currentTime >=
        sound.end
      ){

        audio.pause();


        if(
          sound.loop
        ){

          audio.currentTime =
            sound.start;

          audio.play();

        }
        else{

          pad.classList.remove(
            "playing"
          );

          currentAudio =
            null;

          setStatus("");

        }

      }

    };


  audio.onended =
    ()=>{

      pad.classList.remove(
        "playing"
      );

      currentAudio =
        null;

    };


  audio.play()
    .catch(
      error=>{

        console.error(
          error
        );

        pad.classList.remove(
          "playing"
        );

        setStatus(
          "Wiedergabe konnte nicht gestartet werden."
        );

      }
    );

}



/* =========================================================
   SOUND HINZUFÜGEN ÖFFNEN
========================================================= */


$("addBtn").onclick =
  ()=>{

    $("addDialog")
      .showModal();

  };



/* =========================================================
   HINZUFÜGEN ABBRECHEN
========================================================= */


$("cancelAdd").onclick =
  ()=>{

    $("addDialog")
      .close();

  };



/* =========================================================
   SOUND SPEICHERN
========================================================= */


$("saveAdd").onclick =
  async()=>{

    const file =
      $("audioFile")
      .files[0];


    if(!file){

      alert(
        "Bitte zuerst eine Audiodatei auswählen."
      );

      return;

    }


    try{

      const url =
        URL.createObjectURL(
          file
        );


      const audio =
        new Audio(url);


      await new Promise(
        (resolve,reject)=>{

          audio.onloadedmetadata =
            resolve;

          audio.onerror =
            ()=>reject(
              new Error(
                "Audio konnte nicht gelesen werden."
              )
            );

        }
      );


      const sound = {

        id:
          crypto.randomUUID(),

        name:
          $("soundName")
            .value
            .trim()
          ||
          file.name
            .replace(
              /\.[^.]+$/,
              ""
            ),

        icon:
          $("soundIcon")
            .value
            .trim()
          ||
          "🔊",

        board:
          state.current,

        blob:
          file,

        duration:
          audio.duration,

        start:
          0,

        end:
          audio.duration,

        volume:
          100,

        loop:
          false

      };


      state.sounds.push(
        sound
      );


      await saveSound(
        sound
      );


      await saveMeta();


      $("audioFile").value =
        "";

      $("soundName").value =
        "";


      $("addDialog")
        .close();


      render();


      setStatus(
        "✓ Sound erfolgreich hinzugefügt."
      );


      URL.revokeObjectURL(
        url
      );

    }
    catch(error){

      console.error(
        error
      );

      alert(
        "Die Audiodatei konnte nicht gelesen werden. Bitte MP3, M4A oder WAV verwenden."
      );

    }

  };



/* =========================================================
   EDITOR ÖFFNEN
========================================================= */


function openEditor(
  sound
){

  currentEdit =
    sound;


  $("editTitle")
    .textContent =
      "Bearbeiten: " +
      sound.name;


  $("editName")
    .value =
      sound.name;


  $("startRange")
    .value =
      Math.round(
        sound.start /
        sound.duration *
        100
      );


  $("endRange")
    .value =
      Math.round(
        sound.end /
        sound.duration *
        100
      );


  $("volumeRange")
    .value =
      sound.volume ??
      100;


  updateSelection();


  $("editDialog")
    .showModal();

}



/* =========================================================
   AUSWAHL ANZEIGEN
========================================================= */


function updateSelection(){

  if(!currentEdit)
    return;


  let start =
    +$("startRange")
      .value;


  let end =
    +$("endRange")
      .value;


  if(
    end <= start
  ){

    end =
      Math.min(
        100,
        start + 1
      );

  }


  $("selection")
    .style.left =
      start + "%";


  $("selection")
    .style.right =
      (
        100 - end
      ) + "%";

}



$("startRange")
  .oninput =
    updateSelection;


$("endRange")
  .oninput =
    updateSelection;



/* =========================================================
   EDITOR SCHLIESSEN
========================================================= */


$("closeEdit").onclick =
  ()=>{

    stopAudio();

    $("editDialog")
      .close();

  };



/* =========================================================
   VORSCHAU
========================================================= */


$("previewBtn").onclick =
  ()=>{

    if(!currentEdit)
      return;


    const start =
      +$("startRange")
        .value
      / 100
      *
      currentEdit.duration;


    let end =
      +$("endRange")
        .value
      / 100
      *
      currentEdit.duration;


    if(
      end <= start
    ){

      end =
        Math.min(
          currentEdit.duration,
          start + .1
        );

    }


    currentEdit.start =
      start;


    currentEdit.end =
      end;


    currentEdit.volume =
      +$("volumeRange")
        .value;


    playSound(
      currentEdit,
      {
        classList:{
          add(){},
          remove(){}
        }
      }
    );

  };



/* =========================================================
   EDITOR SPEICHERN
========================================================= */


$("saveEdit").onclick =
  async()=>{

    if(!currentEdit)
      return;


    const start =
      +$("startRange")
        .value
      / 100
      *
      currentEdit.duration;


    let end =
      +$("endRange")
        .value
      / 100
      *
      currentEdit.duration;


    if(
      end <= start
    ){

      end =
        Math.min(
          currentEdit.duration,
          start + .1
        );

    }


    currentEdit.start =
      start;


    currentEdit.end =
      end;


    currentEdit.volume =
      +$("volumeRange")
        .value;


    currentEdit.name =
      $("editName")
        .value
        .trim()
      ||
      currentEdit.name;


    await saveSound(
      currentEdit
    );


    $("editDialog")
      .close();


    render();


    setStatus(
      "✓ Änderungen gespeichert."
    );

  };



/* =========================================================
   NEUES BOARD
========================================================= */


$("boardBtn").onclick =
  async()=>{

    const name =
      prompt(
        "Name des neuen Soundboards:"
      );


    if(
      !name ||
      !name.trim()
    ){

      return;

    }


    const clean =
      name.trim();


    if(
      state.boards
        .includes(clean)
    ){

      alert(
        "Dieses Board existiert bereits."
      );

      return;

    }


    state.boards.push(
      clean
    );


    state.current =
      clean;


    await saveMeta();


    render();

  };



/* =========================================================
   AUFNAHME
========================================================= */


$("recordBtn").onclick =
  async()=>{


    if(recorder){

      recorder.stop();

      return;

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      alert(
        "Dein Browser unterstützt keine Mikrofonaufnahme."
      );

      return;

    }


    try{

      const stream =
        await navigator
          .mediaDevices
          .getUserMedia({
            audio:true
          });


      recordedChunks =
        [];


      recorder =
        new MediaRecorder(
          stream
        );


      $("recordBtn")
        .textContent =
          "■ Aufnahme stoppen";


      $("recordBtn")
        .classList
        .add(
          "recording"
        );


      setStatus(
        "🔴 Aufnahme läuft..."
      );


      recorder
        .ondataavailable =
        event=>{

          if(
            event.data.size
          ){

            recordedChunks
              .push(
                event.data
              );

          }

        };


      recorder.onstop =
        async()=>{


          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          $("recordBtn")
            .textContent =
              "● Aufnahme";


          $("recordBtn")
            .classList
            .remove(
              "recording"
            );


          const blob =
            new Blob(
              recordedChunks,
              {
                type:
                  recorder.mimeType ||
                  "audio/webm"
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const audio =
            new Audio(url);


          try{

            await new Promise(
              (resolve,reject)=>{

                audio.onloadedmetadata =
                  resolve;

                audio.onerror =
                  ()=>reject(
                    new Error(
                      "Aufnahme konnte nicht gelesen werden."
                    )
                  );

              }
            );


            const name =
              prompt(
                "Name für die Aufnahme:",
                "Meine Aufnahme"
              )
              ||
              "Meine Aufnahme";


            const sound = {

              id:
                crypto.randomUUID(),

              name:
                name,

              icon:
                "🎙️",

              board:
                state.current,

              blob:
                blob,

              duration:
                audio.duration,

              start:
                0,

              end:
                audio.duration,

              volume:
                100,

              loop:
                false

            };


            state.sounds.push(
              sound
            );


            await saveSound(
              sound
            );


            await saveMeta();


            render();


            setStatus(
              "✓ Aufnahme gespeichert."
            );

          }
          catch(error){

            console.error(
              error
            );

            alert(
              "Die Aufnahme konnte nicht gespeichert werden."
            );

          }


          URL.revokeObjectURL(
            url
          );


          recorder =
            null;

        };


      recorder.start();

    }
    catch(error){

      console.error(
        error
      );


      alert(
        "Der Zugriff auf das Mikrofon wurde nicht erlaubt."
      );


      recorder =
        null;

    }

  };

async function init(){

  try{

    await openDB();


    const meta =
      await getMeta();


    if(meta){

      state.boards =
        meta.boards ||
        ["Hauptboard"];


      state.current =
        meta.current ||
        state.boards[0];

    }


    state.sounds =
      await getSounds();


    render();


  }
  catch(error){

    console.error(
      error
    );


    alert(
      "Der lokale Speicher konnte nicht geöffnet werden."
    );

  }

}


init();
