<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soundboard">

<title>My Soundboard Studio</title>

<style>
:root{
  color-scheme:dark;
  --bg:#0d0f12;
  --panel:#181b21;
  --panel2:#22262e;
  --line:#343943;
  --text:#f5f7fa;
  --muted:#9da4b0;
  --accent:#5b8cff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}

body{
  padding-bottom:30px;
}

button{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  color:var(--text);
  padding:12px 16px;
  min-height:48px;
  font-size:16px;
  font-weight:500;
}

button:active{
  transform:scale(.97);
}

button.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  font-weight:700;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    14px;
  background:rgba(13,15,18,.95);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

h1{
  margin:0 0 14px;
  font-size:25px;
}

.toolbar{
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.toolbar button{
  flex:0 0 auto;
}

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:16px 14px 80px;
}

.boards{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-bottom:16px;
  scrollbar-width:none;
}

.boards::-webkit-scrollbar{
  display:none;
}

.board{
  flex:0 0 auto;
  white-space:nowrap;
}

.board.active{
  background:var(--panel2);
  border-color:var(--accent);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(min-width:1000px){
  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

.pad{
  min-height:205px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  cursor:pointer;
  transition:
    transform .08s ease,
    border-color .12s ease,
    box-shadow .12s ease;
}

.pad:active{
  transform:scale(.97);
}

.pad.playing{
  border-color:var(--accent);
  box-shadow:
    0 0 0 2px rgba(91,140,255,.28),
    0 8px 30px rgba(91,140,255,.15);
}

.pad-icon{
  font-size:38px;
  line-height:1;
  margin-bottom:12px;
}

.pad-name{
  font-size:20px;
  font-weight:700;
  line-height:1.2;
  word-break:break-word;
}

.pad-time{
  margin-top:7px;
  color:var(--muted);
  font-size:15px;
  font-variant-numeric:tabular-nums;
}

.pad-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.pad-actions button{
  flex:1;
  min-height:43px;
  padding:7px 8px;
  font-size:18px;
}

.empty{
  text-align:center;
  border:1px dashed var(--line);
  border-radius:20px;
  padding:45px 20px;
  color:var(--muted);
  line-height:1.7;
}

.status{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:100;
  background:#252a33;
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:999px;
  color:var(--text);
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

.status.show{
  opacity:1;
}

dialog{
  width:min(94vw,760px);
  max-height:92vh;
  margin:auto;
  padding:0;
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--panel);
  color:var(--text);
  overflow:hidden;
}

dialog::backdrop{
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px);
}

.modal{
  padding:20px;
  max-height:92vh;
  overflow-y:auto;
}

.modal h2{
  margin:0 0 20px;
  font-size:24px;
}

.field{
  margin:16px 0;
}

label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:14px;
}

input[type=text],
input[type=file]{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  font-size:16px;
}

input[type=file]{
  padding:11px;
}

input[type=range]{
  width:100%;
  accent-color:var(--accent);
}

.range-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.range-value{
  color:var(--text);
  font-size:14px;
  text-align:right;
  margin-top:5px;
  font-variant-numeric:tabular-nums;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.row button{
  flex:1;
}

.wave{
  position:relative;
  height:170px;
  border-radius:15px;
  overflow:hidden;
  background:#11141a;
  border:1px solid var(--line);
}

#waveCanvas{
  width:100%;
  height:100%;
  display:block;
}

.selection{
  position:absolute;
  top:0;
  bottom:0;
  background:rgba(91,140,255,.23);
  border-left:3px solid var(--accent);
  border-right:3px solid var(--accent);
  pointer-events:none;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
  margin:15px 0;
}

.checkbox input{
  width:20px;
  height:20px;
}

.note{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.recording{
  color:#ff6262!important;
  border-color:#ff6262!important;
}

@media(max-width:450px){
  .pad{
    min-height:190px;
    padding:14px;
  }

  .pad-name{
    font-size:18px;
  }

  .pad-icon{
    font-size:34px;
  }

  h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>

<h1>🎛️ My Soundboard Studio</h1>

<div class="toolbar">

<button class="primary" id="addBtn">
＋ Sound hinzufügen
</button>

<button id="recordBtn">
● Aufnahme
</button>

<button id="boardBtn">
＋ Board
</button>

<button id="stopAllBtn">
■ Alle stoppen
</button>

</div>

</header>


<main>

<div class="boards" id="boards"></div>

<div class="grid" id="grid"></div>

<div class="empty" id="empty">
Noch keine Sounds vorhanden.<br>
Importiere einen Sound oder nimm einen auf.
</div>

</main>


<div class="status" id="status"></div>


<!-- =====================================================
     SOUND HINZUFÜGEN
===================================================== -->

<dialog id="addDialog">

<div class="modal">

<h2>🔊 Sound hinzufügen</h2>

<div class="field">

<label>Audiodatei auswählen</label>

<input
  id="audioFile"
  type="file"
  accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm">

</div>


<div class="field">

<label>Name</label>

<input
  id="soundName"
  type="text"
  placeholder="z. B. Applaus">

</div>


<div class="field">

<label>Icon</label>

<input
  id="soundIcon"
  type="text"
  value="🔊">

</div>


<div class="row">

<button id="cancelAdd">
Abbrechen
</button>

<button class="primary" id="saveAdd">
Speichern
</button>

</div>

</div>

</dialog>


<!-- =====================================================
     EDITOR
===================================================== -->

<dialog id="editDialog">

<div class="modal">

<h2 id="editTitle">
Sound bearbeiten
</h2>


<div class="wave">

<canvas id="waveCanvas"></canvas>

<div
  class="selection"
  id="selection">
</div>

</div>


<div class="range-row">

<div class="field">

<label>Start</label>

<input
  id="startRange"
  type="range"
  min="0"
  max="100000"
  step="1"
  value="0">

<div
  class="range-value"
  id="startValue">
0.000 s
</div>

</div>


<div class="field">

<label>Ende</label>

<input
  id="endRange"
  type="range"
  min="0"
  max="100000"
  step="1"
  value="100000">

<div
  class="range-value"
  id="endValue">
0.000 s
</div>

</div>

</div>


<div class="field">

<label>Lautstärke</label>

<input
  id="volumeRange"
  type="range"
  min="0"
  max="100"
  value="100">

<div class="range-value">
<span id="volumeValue">100</span> %
</div>

</div>


<div class="checkbox">

<input
  id="loopCheck"
  type="checkbox">

<label for="loopCheck">
Sound wiederholen
</label>

</div>


<div class="field">

<label>Name</label>

<input
  id="editName"
  type="text">

</div>


<div class="row">

<button id="closeEdit">
Schließen
</button>

<button id="previewBtn">
▶ Vorschau
</button>

<button class="primary" id="saveEdit">
Speichern
</button>

</div>


<p class="note">
Der Schnitt wird auf die Millisekunde genau gespeichert.
Die ursprüngliche Audiodatei bleibt erhalten.
</p>

</div>

</dialog>


<script>

/* =====================================================
   KONFIGURATION
===================================================== */

const DB_NAME = "MySoundboardStudio";

const DB_VERSION = 7;


/* =====================================================
   APP STATE
===================================================== */

let db = null;

let state = {

  boards:[
    "Hauptboard"
  ],

  current:
    "Hauptboard",

  sounds:[]

};


let currentEdit = null;

let currentAudio = null;

let currentPad = null;

let recorder = null;

let recordedChunks = [];


/*
  Hier speichern wir vorbereitete
  Audio-Elemente.
*/

const audioElements =
  new Map();


/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

const $ =
  id =>
    document.getElementById(id);


function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return Date.now() +
    "-" +
    Math.random();

}


function esc(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c])
    );

}


function showStatus(text){

  const element =
    $("status");

  element.textContent =
    text;

  element.classList.add(
    "show"
  );

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      1800
    );

}


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){

    return "00:00.000";

  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    seconds % 60;

  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    secs
      .toFixed(3)
      .padStart(6,"0")
  );

}


/* =====================================================
   INDEXED DB
===================================================== */

function openDB(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        () => {

          const database =
            request.result;


          if(
            !database
              .objectStoreNames
              .contains("meta")
          ){

            database.createObjectStore(
              "meta",
              {
                keyPath:"key"
              }
            );

          }


          if(
            !database
              .objectStoreNames
              .contains("sounds")
          ){

            database.createObjectStore(
              "sounds",
              {
                keyPath:"id"
              }
            );

          }

        };


      request.onsuccess =
        () => {

          db =
            request.result;

          resolve();

        };


      request.onerror =
        () => {

          reject(
            request.error
          );

        };

    }
  );

}


function getMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction("meta")
          .objectStore("meta")
          .get("state");


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


function saveMeta(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "meta",
            "readwrite"
          )
          .objectStore("meta")
          .put({

            key:"state",

            boards:
              state.boards,

            current:
              state.current

          });


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


function getSounds(){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction("sounds")
          .objectStore("sounds")
          .getAll();


      request.onsuccess =
        () =>
          resolve(
            request.result
          );


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


function saveSound(sound){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "sounds",
            "readwrite"
          )
          .objectStore("sounds")
          .put(sound);


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


function deleteSound(id){

  return new Promise(
    (resolve,reject)=>{

      const request =
        db
          .transaction(
            "sounds",
            "readwrite"
          )
          .objectStore("sounds")
          .delete(id);


      request.onsuccess =
        () =>
          resolve();


      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


/* =====================================================
   ALTE SOUNDS MIGRIEREN
===================================================== */

async function migrateSound(sound){

  /*
    Neue Version:
    audioData = ArrayBuffer
  */

  if(
    sound.audioData instanceof
    ArrayBuffer
  ){

    return true;

  }


  /*
    Manche Browser liefern
    Uint8Array.
  */

  if(
    sound.audioData instanceof
    Uint8Array
  ){

    sound.audioData =
      sound.audioData.buffer;

    await saveSound(
      sound
    );

    return true;

  }


  /*
    Alte Version:
    blob
  */

  if(
    sound.blob instanceof Blob
  ){

    sound.type =
      sound.type ||
      sound.blob.type ||
      "audio/mpeg";


    sound.audioData =
      await sound.blob.arrayBuffer();


    delete sound.blob;


    await saveSound(
      sound
    );


    return true;

  }


  return false;

}


/* =====================================================
   AUDIO-DATEN → AUDIO ELEMENT
===================================================== */

async function createAudioElement(
  sound
){

  await migrateSound(
    sound
  );


  if(
    !sound.audioData
  ){

    throw new Error(
      "Keine Audiodaten"
    );

  }


  /*
    Wenn bereits ein Audio-Element
    existiert, verwenden wir dieses.
  */

  if(
    audioElements.has(
      sound.id
    )
  ){

    return audioElements.get(
      sound.id
    );

  }


  const blob =
    new Blob(
      [
        sound.audioData
      ],
      {
        type:
          sound.type ||
          "audio/mpeg"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const audio =
    document.createElement(
      "audio"
    );


  audio.preload =
    "auto";


  audio.playsInline =
    true;


  audio.setAttribute(
    "playsinline",
    ""
  );


  audio.src =
    url;


  /*
    Browser soll die Datei
    sofort vorbereiten.
  */

  audio.load();


  audioElements.set(
    sound.id,
    {
      audio,
      url
    }
  );


  return {
    audio,
    url
  };

}


/* =====================================================
   AUDIO STOPPEN
===================================================== */

function stopAll(){

  /*
    Aktuelles Audio stoppen.
  */

  if(
    currentAudio
  ){

    try{

      currentAudio.pause();

      currentAudio.currentTime =
        0;

    }catch(e){}

  }


  /*
    Alle vorbereiteten Elemente
    ebenfalls stoppen.
  */

  audioElements.forEach(
    item => {

      try{

        item.audio.pause();

        item.audio.currentTime =
          0;

      }catch(e){}

    }
  );


  document
    .querySelectorAll(
      ".playing"
    )
    .forEach(
      element =>
        element.classList.remove(
          "playing"
        )
    );


  currentAudio =
    null;


  currentPad =
    null;

}


/* =====================================================
   SOUND ABSPIELEN
===================================================== */

async function playSound(
  sound,
  pad
){

  /*
    Zuerst alles stoppen.

    Dadurch startet auch derselbe
    Sound bei erneutem Tippen
    garantiert von vorne.
  */

  stopAll();


  try{

    const item =
      await createAudioElement(
        sound
      );


    const audio =
      item.audio;


    /*
      Wichtig für iPhone/Safari:
      Das Audio-Element wird
      nicht neu erzeugt.
    */

    audio.pause();


    /*
      Start und Ende bestimmen.
    */

    let start =
      Number(sound.start);


    let end =
      Number(sound.end);


    const duration =
      Number(sound.duration) ||
      audio.duration;


    if(
      !Number.isFinite(start)
    ){

      start = 0;

    }


    if(
      !Number.isFinite(end) ||
      end <= 0
    ){

      end =
        duration;

    }


    start =
      Math.max(
        0,
        Math.min(
          start,
          duration
        )
      );


    end =
      Math.max(
        start + 0.001,
        Math.min(
          end,
          duration
        )
      );


    audio.volume =
      Math.max(
        0,
        Math.min(
          1,
          Number(
            sound.volume ?? 100
          ) / 100
        )
      );


    /*
      Safari darf den gleichen
      Audio-Tag erneut verwenden.
    */

    audio.currentTime =
      start;


    currentAudio =
      audio;


    currentPad =
      pad;


    if(pad){

      pad.classList.add(
        "playing"
      );

    }


    /*
      Über timeupdate beenden wir
      exakt am gewünschten Ende.
    */

    const finish =
      () => {

        if(
          currentAudio !==
          audio
        ){

          audio.removeEventListener(
            "timeupdate",
            finish
          );

          return;

        }


        if(
          audio.currentTime >=
          end - 0.003
        ){

          if(
            sound.loop
          ){

            audio.currentTime =
              start;

            audio.play()
              .catch(
                console.error
              );

          }else{

            audio.pause();

            audio.currentTime =
              0;


            if(pad){

              pad.classList.remove(
                "playing"
              );

            }


            currentAudio =
              null;

            currentPad =
              null;

          }

        }

      };


    audio.addEventListener(
      "timeupdate",
      finish
    );


    /*
      Wenn die Datei normal endet.
    */

    const ended =
      () => {

        audio.removeEventListener(
          "timeupdate",
          finish
        );


        if(
          currentAudio ===
          audio
        ){

          if(pad){

            pad.classList.remove(
              "playing"
            );

          }

          currentAudio =
            null;

          currentPad =
            null;

        }

      };


    audio.addEventListener(
      "ended",
      ended,
      {
        once:true
      }
    );


    /*
      Jetzt erfolgt der eigentliche
      Start.
    */

    await audio.play();


  }catch(error){

    console.error(
      "Audio playback error:",
      error
    );


    if(pad){

      pad.classList.remove(
        "playing"
      );

    }


    currentAudio =
      null;


    currentPad =
      null;


    showStatus(
      "Sound konnte nicht abgespielt werden"
    );

  }

}


/* =====================================================
   WAVEFORM
===================================================== */

async function drawWaveform(
  sound
){

  try{

    await migrateSound(
      sound
    );


    if(
      !sound.audioData
    ){

      return;

    }


    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioContext){

      return;

    }


    const context =
      new AudioContext();


    const buffer =
      await context.decodeAudioData(
        sound.audioData.slice(0)
      );


    const canvas =
      $("waveCanvas");


    const rect =
      canvas.getBoundingClientRect();


    const ratio =
      window.devicePixelRatio ||
      1;


    const width =
      Math.max(
        1,
        rect.width
      );


    const height =
      Math.max(
        1,
        rect.height
      );


    canvas.width =
      width * ratio;


    canvas.height =
      height * ratio;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );


    const data =
      buffer.getChannelData(
        0
      );


    const step =
      Math.max(
        1,
        Math.floor(
          data.length /
          width
        )
      );


    const middle =
      height / 2;


    const amplitude =
      height * .43;


    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    ctx.beginPath();


    for(
      let x=0;
      x<width;
      x++
    ){

      const start =
        Math.floor(
          x * step
        );


      let min=1;
      let max=-1;


      for(
        let i=0;
        i<step &&
        start+i<data.length;
        i++
      ){

        const value =
          data[start+i];


        if(
          value < min
        ){

          min=value;

        }


        if(
          value > max
        ){

          max=value;

        }

      }


      ctx.moveTo(
        x,
        middle +
        min * amplitude
      );


      ctx.lineTo(
        x,
        middle +
        max * amplitude
      );

    }


    ctx.strokeStyle =
      "#5b8cff";


    ctx.lineWidth =
      1;


    ctx.stroke();


    /*
      AudioContext für die
      Darstellung schließen.
    */

    await context.close();

  }catch(error){

    console.error(
      "Waveform:",
      error
    );

  }

}


/* =====================================================
   SCHNITTANZEIGE
===================================================== */

function updateSelection(){

  if(
    !currentEdit
  ){

    return;

  }


  const start =
    Number(
      $("startRange").value
    ) / 100000;


  const end =
    Number(
      $("endRange").value
    ) / 100000;


  const duration =
    Number(
      currentEdit.duration
    ) || 0;


  $("selection").style.left =
    start * 100 +
    "%";


  $("selection").style.right =
    (1-end) * 100 +
    "%";


  $("startValue").textContent =
    formatTime(
      start * duration
    );


  $("endValue").textContent =
    formatTime(
      end * duration
    );


  $("volumeValue").textContent =
    $("volumeRange").value;

}


/* =====================================================
   EDITOR
===================================================== */

async function openEditor(
  sound
){

  currentEdit =
    sound;


  $("editTitle").textContent =
    "Bearbeiten: " +
    sound.name;


  $("editName").value =
    sound.name;


  const duration =
    Number(sound.duration) ||
    0;


  let start =
    Number(sound.start) ||
    0;


  let end =
    Number(sound.end);


  if(
    !Number.isFinite(end) ||
    end <= 0
  ){

    end =
      duration;

  }


  $("startRange").value =
    Math.round(
      (
        start /
        duration
      ) *
      100000
    );


  $("endRange").value =
    Math.round(
      (
        end /
        duration
      ) *
      100000
    );


  $("volumeRange").value =
    sound.volume ??
    100;


  $("loopCheck").checked =
    !!sound.loop;


  updateSelection();


  $("editDialog")
    .showModal();


  await drawWaveform(
    sound
  );

}

/* =====================================================
   EDITOR SPEICHERN
===================================================== */

$("saveEdit").onclick =
  async () => {

    if(
      !currentEdit
    ){

      return;

    }


    const duration =
      Number(
        currentEdit.duration
      );


    const start =
      Number(
        $("startRange").value
      ) /
      100000 *
      duration;


    let end =
      Number(
        $("endRange").value
      ) /
      100000 *
      duration;


    end =
      Math.max(
        start + .001,
        Math.min(
          duration,
          end
        )
      );


    currentEdit.start =
      start;


    currentEdit.end =
      end;


    currentEdit.volume =
      Number(
        $("volumeRange").value
      );


    currentEdit.loop =
      $("loopCheck").checked;


    currentEdit.name =
      $("editName")
        .value
        .trim()
      ||
      currentEdit.name;


    await saveSound(
      currentEdit
    );


    $("editDialog")
      .close();


    showStatus(
      "Änderungen gespeichert ✓"
    );


    render();

  };


/* =====================================================
   SOUND IMPORTIEREN
===================================================== */

$("addBtn").onclick =
  () => {

    $("addDialog")
      .showModal();

  };


$("cancelAdd").onclick =
  () => {

    $("addDialog")
      .close();

  };


$("saveAdd").onclick =
  async () => {

    const file =
      $("audioFile")
        .files[0];


    if(!file){

      alert(
        "Bitte zuerst eine Audiodatei auswählen."
      );

      return;

    }


    try{

      showStatus(
        "Sound wird gespeichert …"
      );


      /*
        WICHTIG:

        Die Datei wird vollständig
        aus dem iPhone-Downloads-Ordner
        eingelesen.
      */

      const audioData =
        await file.arrayBuffer();


      /*
        Audio-Dauer bestimmen.
      */

      const tempAudio =
        document.createElement(
          "audio"
        );


      const tempURL =
        URL.createObjectURL(
          file
        );


      tempAudio.src =
        tempURL;


      tempAudio.preload =
        "metadata";


      await new Promise(
        (resolve,reject)=>{

          tempAudio.onloadedmetadata =
            resolve;

          tempAudio.onerror =
            reject;

        }
      );


      const duration =
        tempAudio.duration;


      URL.revokeObjectURL(
        tempURL
      );


      const sound = {

        id:
          uid(),

        name:
          $("soundName")
            .value
            .trim()
          ||
          file.name.replace(
            /\.[^.]+$/,
            ""
          ),

        icon:
          $("soundIcon")
            .value
            .trim()
          ||
          "🔊",

        board:
          state.current,

        /*
          DIESE DATEN BLEIBEN
          IN DER APP GESPEICHERT.
        */

        audioData:
          audioData,

        type:
          file.type ||
          "audio/mpeg",

        duration:
          duration,

        start:
          0,

        end:
          duration,

        volume:
          100,

        loop:
          false

      };


      state.sounds.push(
        sound
      );


      await saveSound(
        sound
      );


      await saveMeta();


      /*
        Audio sofort vorbereiten.
      */

      try{

        await createAudioElement(
          sound
        );

      }catch(e){

        console.warn(
          "Preload:",
          e
        );

      }


      $("audioFile").value =
        "";


      $("soundName").value =
        "";


      $("addDialog")
        .close();


      render();


      showStatus(
        "Sound dauerhaft gespeichert ✓"
      );


    }catch(error){

      console.error(
        "Import:",
        error
      );


      alert(
        "Die Audiodatei konnte nicht gelesen werden."
      );

    }

  };

/* =====================================================
   AUFNAHME
===================================================== */

$("recordBtn").onclick =
  async () => {

    if(recorder){

      recorder.stop();

      return;

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      alert(
        "Dein Browser unterstützt keine Mikrofonaufnahme."
      );

      return;

    }


    if(
      !window.MediaRecorder
    ){

      alert(
        "Dein Browser unterstützt keine Audioaufnahme."
      );

      return;

    }


    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });


      recordedChunks =
        [];


      recorder =
        new MediaRecorder(
          stream
        );


      $("recordBtn")
        .textContent =
        "■ Aufnahme stoppen";


      $("recordBtn")
        .classList.add(
          "recording"
        );


      recorder.ondataavailable =
        event => {

          if(
            event.data &&
            event.data.size
          ){

            recordedChunks.push(
              event.data
            );

          }

        };


      recorder.onstop =
        async () => {

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          $("recordBtn")
            .textContent =
            "● Aufnahme";


          $("recordBtn")
            .classList.remove(
              "recording"
            );


          try{

            const blob =
              new Blob(
                recordedChunks,
                {
                  type:
                    recorder.mimeType ||
                    "audio/webm"
                }
              );


            const audioData =
              await blob.arrayBuffer();


            const tempAudio =
              document.createElement(
                "audio"
              );


            const tempURL =
              URL.createObjectURL(
                blob
              );


            tempAudio.src =
              tempURL;


            await new Promise(
              (resolve,reject)=>{

                tempAudio.onloadedmetadata =
                  resolve;

                tempAudio.onerror =
                  reject;

              }
            );


            const duration =
              tempAudio.duration;


            URL.revokeObjectURL(
              tempURL
            );


            const name =
              prompt(
                "Name für die Aufnahme:",
                "Meine Aufnahme"
              )
              ||
              "Meine Aufnahme";


            const sound = {

              id:
                uid(),

              name:
                name,

              icon:
                "🎙️",

              board:
                state.current,

              audioData:
                audioData,

              type:
                blob.type,

              duration:
                duration,

              start:
                0,

              end:
                duration,

              volume:
                100,

              loop:
                false

            };


            state.sounds.push(
              sound
            );


            await saveSound(
              sound
            );


            await saveMeta();


            await createAudioElement(
              sound
            );


            render();


            showStatus(
              "Aufnahme gespeichert ✓"
            );


          }catch(error){

            console.error(
              error
            );


            alert(
              "Die Aufnahme konnte nicht gespeichert werden."
            );

          }


          recorder =
            null;

        };


      recorder.start();


    }catch(error){

      console.error(
        error
      );


      alert(
        "Der Zugriff auf das Mikrofon wurde nicht erlaubt."
      );

    }

  };


/* =====================================================
   RENDER
===================================================== */

function render(){

  $("boards").innerHTML =
    "";


  state.boards.forEach(
    board => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "board" +
        (
          board ===
          state.current
          ?
          " active"
          :
          ""
        );


      button.textContent =
        board;


      button.onclick =
        async () => {

          state.current =
            board;


          await saveMeta();


          render();

        };


      $("boards")
        .appendChild(
          button
        );

    }
  );


  $("grid").innerHTML =
    "";


  const sounds =
    state.sounds.filter(
      sound =>
        sound.board ===
        state.current
    );


  $("empty").style.display =
    sounds.length
    ?
    "none"
    :
    "block";


  sounds.forEach(
    sound => {

      const pad =
        document.createElement(
          "div"
        );


      pad.className =
        "pad";


      const duration =
        Math.max(
          0,
          (
            Number(sound.end) ||
            Number(sound.duration) ||
            0
          )
          -
          (
            Number(sound.start) ||
            0
          )
        );


      pad.innerHTML = `

        <div>

          <div class="pad-icon">
            ${esc(sound.icon || "🔊")}
          </div>

          <div class="pad-name">
            ${esc(sound.name)}
          </div>

          <div class="pad-time">
            ${formatTime(duration)}
          </div>

        </div>

        <div class="pad-actions">

          <button data-edit>
            ✎
          </button>

          <button data-delete>
            🗑️
          </button>

        </div>

      `;


      /*
        DIE GANZE KARTE
        IST DER PLAY-BUTTON.
      */

      pad.onclick =
        () => {

          playSound(
            sound,
            pad
          );

        };


      /*
        Bearbeiten
      */

      pad
        .querySelector(
          "[data-edit]"
        )
        .onclick =
        event => {

          event.stopPropagation();

          openEditor(
            sound
          );

        };


      /*
        Löschen
      */

      pad
        .querySelector(
          "[data-delete]"
        )
        .onclick =
        async event => {

          event.stopPropagation();


          if(
            !confirm(
              "Diesen Sound wirklich löschen?"
            )
          ){

            return;

          }


          if(
            currentAudio
          ){

            stopAll();

          }


          const prepared =
            audioElements.get(
              sound.id
            );


          if(prepared){

            try{

              prepared.audio.pause();

            }catch(e){}


            try{

              URL.revokeObjectURL(
                prepared.url
              );

            }catch(e){}


            audioElements.delete(
              sound.id
            );

          }


          state.sounds =
            state.sounds.filter(
              item =>
                item.id !==
                sound.id
            );


          await deleteSound(
            sound.id
          );


          render();

        };


      $("grid")
        .appendChild(
          pad
        );

    }
  );

}


/* =====================================================
   INITIALISIERUNG
===================================================== */

async function init(){

  try{

    await openDB();


    const meta =
      await getMeta();


    if(meta){

      if(
        Array.isArray(
          meta.boards
        ) &&
        meta.boards.length
      ){

        state.boards =
          meta.boards;

      }


      if(
        meta.current &&
        state.boards.includes(
          meta.current
        )
      ){

        state.current =
          meta.current;

      }else{

        state.current =
          state.boards[0];

      }

    }


    /*
      Sounds aus IndexedDB.
    */

    state.sounds =
      await getSounds();


    /*
      Alte Blob-Sounds
      automatisch konvertieren.
    */

    for(
      const sound of
      state.sounds
    ){

      try{

        await migrateSound(
          sound
        );

      }catch(error){

        console.warn(
          "Migration fehlgeschlagen:",
          error
        );

      }

    }


    render();


    /*
      Jetzt vorbereiten wir die
      gespeicherten Sounds.

      Dadurch liegt beim Tippen
      bereits ein Audio-Element vor.
    */

    for(
      const sound of
      state.sounds
    ){

      try{

        await createAudioElement(
          sound
        );

      }catch(error){

        console.warn(
          "Audio konnte nicht vorbereitet werden:",
          sound.name,
          error
        );

      }

    }


  }catch(error){

    console.error(
      "Initialisierung:",
      error
    );


    alert(
      "Der lokale Speicher konnte nicht geöffnet werden."
    );

  }

}

   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    if(
      currentEdit
    ){

      drawWaveform(
        currentEdit
      );

    }

  }
);


/* START */

init();
